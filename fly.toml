# WhaleChat — Fly.io deployment
# Docs: DEPLOY-FLY.md
app = "whalechat-live"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8090"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  # keep the process up and responsive for every user at all times
  UV_THREADPOOL_SIZE = "8"

[mounts]
  source = "wc_data"
  destination = "/data"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "4s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
