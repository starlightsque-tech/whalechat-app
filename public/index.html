<style>
  html,body{height:100%;margin:0;background:#04101a;color:#e9f4f9;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  .glow{position:fixed;inset:0;background:
    radial-gradient(circle at 50% 18%,rgba(46,230,201,.16),transparent 55%),
    radial-gradient(circle at 50% 90%,rgba(58,160,255,.10),transparent 60%)}
  .box{position:relative;padding:28px;max-width:420px}
  .logo{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 1px rgba(46,230,201,.35),0 18px 50px rgba(0,0,0,.55);
    animation:float 3.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  h1{font-size:24px;margin:18px 0 6px;letter-spacing:-.02em}
  p{color:#8ba4b6;font-size:13.5px;margin:0;line-height:1.6}
  a{display:inline-block;margin-top:20px;padding:13px 26px;border-radius:12px;font-weight:700;text-decoration:none;
    color:#03221d;background:linear-gradient(135deg,#2ee6c9,#3aa0ff);box-shadow:0 10px 24px rgba(46,230,201,.22)}
  .bar{margin:22px auto 0;width:150px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#2ee6c9,#3aa0ff);
    animation:load 1.1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}
  .fine{margin-top:18px;font-size:11px;color:#63798a}
</style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5WNCBL8N" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <div class="glow"></div>
  <div class="box">
    <img class="logo" src="./assets/logo.png" alt="WhaleChat"/>
    <h1>WhaleChat</h1>
    <p>Chat, shop and get paid in one calm place.</p>
    <div class="bar"><i></i></div>
    <a href="./whalechat.html">Open WhaleChat</a>
    <div class="fine">Installable on Android, iPhone and desktop</div>
  </div>
  <script>
  (function () {
    var m = location.pathname.match(/\/ref[=\/]([A-Za-z0-9_-]+)\/?$/i) || location.pathname.match(/\/r\/([A-Za-z0-9_-]+)\/?$/i);
    var q = new URLSearchParams(location.search).get('ref');
    var code = ((m && m[1]) || q || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
    var target = code
      ? './whalechat.html?ref=' + encodeURIComponent(code) + '#/signup?ref=' + encodeURIComponent(code)
      : './whalechat.html' + location.search + (location.hash || '');
    // small delay so the branded entry never flashes as a dead end
    setTimeout(function () { location.replace(target); }, 550);
    document.querySelector('a').addEventListener('click', function () { location.href = target; });
  })();
  </script>
</body>
