name: Keep Supabase project active

# Supabase pauses a FREE project after 7 days without any activity. This workflow
# touches the project every 6 hours so it never reaches that window, and pings the
# app so its health endpoint is exercised too.
#
# Needs one repository secret: SUPABASE_ANON_KEY
# (Supabase dashboard → Project Settings → API → anon public). The key is public
# by design, but keep it in a secret anyway.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the WhaleChat app
        run: |
          set +e
          curl -fsS --max-time 45 https://whalechat-8kgo.onrender.com/api/health -o /tmp/health.json
          echo "app status: $?"
          head -c 400 /tmp/health.json 2>/dev/null | tr -d '\n'
          echo

      - name: Touch Supabase (auth health = project activity)
        env:
          SUPABASE_URL: https://eiikmbuzxfnsmtcrfgut.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY secret is missing — add it to keep the project active."
            exit 0
          fi
          auth_code=$(curl -s -o /tmp/auth.json -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "auth health: $auth_code"; head -c 200 /tmp/auth.json; echo

          rest_code=$(curl -s -o /tmp/rest.json -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/whalechat_heartbeat?select=at&limit=1")
          echo "rest heartbeat: $rest_code"; head -c 200 /tmp/rest.json; echo

          if [ "$auth_code" -ge 400 ] && [ "$rest_code" -ge 400 ]; then
            echo "::warning::Both probes returned an error — the project may be paused. Restore it from the Supabase dashboard."
          fi

      - name: Report
        run: |
          {
            echo "### Supabase keep-alive"
            echo ""
            echo "Free projects pause after **7 days without activity**; this job touches the project every 6 hours."
            echo "Check the previous step's log for the HTTP codes (200/401 both count as activity)."
          } >> "$GITHUB_STEP_SUMMARY"
