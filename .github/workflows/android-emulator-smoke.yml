name: Android emulator smoke test

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct APK URL to install (leave blank to use the APK in the repo)'
        required: false
        type: string
      wait_seconds:
        description: 'Seconds to wait after launch before the screenshot'
        required: false
        default: '25'
        type: string
      login_email:
        description: 'Optional admin/user email to log in before the screenshot'
        required: false
        type: string
      login_password:
        description: 'Optional password for the login above'
        required: false
        type: string
      target_hash:
        description: 'Optional in-app route after login, e.g. #/invest/market'
        required: false
        default: '#/invest/market'
        type: string
  push:
    paths:
      - 'whalechat-release.apk'
      - '.github/workflows/android-emulator-smoke.yml'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate or download APK
        run: |
          set -e
          if [ -n "${{ inputs.apk_url }}" ]; then
            curl -fL "${{ inputs.apk_url }}" -o /tmp/whalechat-target.apk
            APK=/tmp/whalechat-target.apk
          else
            APK="$(ls whalechat-release.apk files/*.apk public/*.apk 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$APK" ]; then
            echo "No APK supplied and none in the repo." >&2
            exit 1
          fi
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "WAIT_SECONDS=${{ inputs.wait_seconds || '25' }}" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run APK on emulator and capture screenshot
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ env.APK_PATH }}
          WAIT_SECONDS: ${{ env.WAIT_SECONDS }}
          LOGIN_EMAIL: ${{ inputs.login_email }}
          LOGIN_PASSWORD: ${{ inputs.login_password }}
          TARGET_HASH: ${{ inputs.target_hash }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/emulator-market-shot.sh

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: whalechat-emulator-screenshot
          path: |
            whalechat-emulator.png
            step-*.png
          if-no-files-found: error
