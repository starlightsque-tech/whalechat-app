name: Daily Supabase state backup

# Exports whalechat_state (the whole app database) to a dated JSON file every day
# and keeps 14 of them as downloadable workflow artifacts.
# Needs one repository secret: DATABASE_URL (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: '30 2 * * *'          # 02:30 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the DATABASE_URL secret
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret (Supabase pooler connection string)."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --omit=optional --no-audit --no-fund

      - name: Export whalechat_state
        id: export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup-state.mjs --out=./backups --retention=14

      - name: Upload the backup (retained 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: whalechat-state-${{ steps.export.outputs.day }}
          path: |
            backups/whalechat-state-*.json
            backups/whalechat-state-*.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### WhaleChat state backup"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Day | ${{ steps.export.outputs.day }} |"
            echo "| rev | ${{ steps.export.outputs.rev }} |"
            echo "| users | ${{ steps.export.outputs.users }} |"
            echo "| sha256 | \`${{ steps.export.outputs.sha256 }}\` |"
            echo ""
            echo "Download it from the **Artifacts** section of this run (kept 14 days)."
          } >> "$GITHUB_STEP_SUMMARY"
