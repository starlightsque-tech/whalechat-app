name: QA audit

# Runs the offline/runtime/UI harnesses and the full route audit on every push,
# so a regression in any user or admin screen fails loudly instead of shipping.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save jsdom fake-indexeddb --no-audit --no-fund

      - name: Build the bundle
        run: node scripts/prepare-assets.js

      - name: Static offline checks
        run: npm run test:offline

      - name: Offline runtime harness
        run: npm run test:offline:runtime

      - name: Trading UI harness
        run: npm run test:ui

      - name: Route audit (user + admin, online + offline)
        run: npm run audit:routes
        env:
          NODE_OPTIONS: --max-old-space-size=900
